version: '3.8'
services:
  blockchain:
    image: campusvotingacrsea7768.azurecr.io/voting-blockchain:latest
    command: ["sh", "-c", "npx ganache --server.host 0.0.0.0 --chain.chainId 31337 --port 8545 --wallet.mnemonic 'test test test test test test test test test test test junk' --database.dbPath /app/ganache_data & sleep 5 && npx hardhat run scripts/deploy.ts --network localhost && wait"]
    volumes:
      - ${WEBAPP_STORAGE_HOME}/ganache_data:/app/ganache_data
      - ${WEBAPP_STORAGE_HOME}/site/wwwroot/ignition:/app/ignition/deployments
  backend:
    image: campusvotingacrsea7768.azurecr.io/voting-backend:latest
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - RPC_URL=${RPC_URL:-http://blockchain:8545}
      - EMAIL_USER=${EMAIL_USER:?EMAIL_USER is required}
      - EMAIL_PASS=${EMAIL_PASS:?EMAIL_PASS is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      - ADMIN_PRIVATE_KEY=${ADMIN_PRIVATE_KEY:?ADMIN_PRIVATE_KEY is required}
      - VOTING_ADDRESS=${VOTING_ADDRESS:?VOTING_ADDRESS is required}
      - FORWARDER_ADDRESS=${FORWARDER_ADDRESS:?FORWARDER_ADDRESS is required}
  frontend:
    image: campusvotingacrsea7768.azurecr.io/voting-frontend:latest
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=https://campusvotingappsea7768.azurewebsites.net
      - NEXT_PUBLIC_RPC_URL=https://campusvotingappsea7768.azurewebsites.net/rpc
      - BACKEND_URL=http://backend:3001
      - RPC_URL=http://blockchain:8545

